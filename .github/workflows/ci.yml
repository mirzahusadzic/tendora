name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Offline checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['24']
        # package.json asks for Node 24 or later: the current release too.
        include:
          - os: ubuntu-latest
            node: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.6'
          enable-cache: false
      - run: npm ci
      - run: npm run setup:python
      - name: Check Python version
        run: .venv/bin/python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - run: npm run format:check
      - run: npm run check
      - name: Install pinned Bolinas reference
        run: npm run setup:bolinas
      - name: Cross-check grammar extraction
        run: |
          .venv/bin/python tools/bolinas.py test
          npm run check:research
